<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BMW GAIA Telemetry OS</title>
    <!-- Single Page Application routing redirect for GitHub Pages (https://github.com/rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      // Number of path segments to keep for the base URL.
      // If deployed to a project page (e.g. https://username.github.io/repo-name/), this is 1.
      // If deployed to a user or custom domain (e.g. https://username.github.io/ or https://custom.com/), this is 0.
      var isProjectPage = window.location.hostname.endsWith('github.io') &&
        window.location.pathname.split('/').filter(Boolean).length > 0 &&
        !window.location.hostname.startsWith(window.location.pathname.split('/').filter(Boolean)[0]);
      
      var pathSegmentsToKeep = isProjectPage ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        background-color: #131315;
        color: #e5e1e4;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
  </body>
</html>

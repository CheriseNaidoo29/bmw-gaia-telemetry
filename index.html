    <!-- Prevent white flash on initial load -->
    <style>
      html, body {
        background-color: #131315 !important;
        color: #e5e1e4 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>

    <!-- GitHub Pages Single Page App Redirect Handler & Trailing Slash Fix -->
    <script type="text/javascript">
      (function() {
        // If loaded without trailing slash on a folder path on GitHub Pages, redirect with slash
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }

        // SPA redirect query decoder from 404.html
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&'); 
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

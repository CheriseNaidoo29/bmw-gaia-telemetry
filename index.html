<!doctype html>
<html lang="en" class="dark" style="background-color: #131315;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#131315" />
    <title>BMW GAIA Telemetry OS</title>
    <meta name="description" content="Mission-critical AI monitoring console and telemetry dashboard for BMW GAIA infrastructure, autonomous vehicle diagnostics, and ECS cloud clusters." />
    <meta property="og:title" content="BMW GAIA Telemetry OS" />
    <meta property="og:description" content="Mission-critical AI monitoring console and telemetry dashboard for BMW GAIA infrastructure, autonomous vehicle diagnostics, and ECS cloud clusters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 1. Zero-Latency Anti-Flash Dark Styles: Enforces dark canvas instantly before any external CSS is fetched -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body, #root {
        background-color: #131315 !important;
        color: #e5e1e4 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
    </style>

    <!-- 2. GitHub Pages SPA Routing & Trailing-Slash Normalizer Script -->
    <script type="text/javascript">
      (function() {
        // Trailing-slash normalization: If user opens '.../repo-name' without trailing '/',
        // normalize to '.../repo-name/' immediately so relative asset paths ('./assets/...') resolve properly.
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }

        // SPA Route Decoding: Decodes redirected routes from public/404.html
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&'); 
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>

    <!-- 3. Preconnect & Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#131315] text-[#e5e1e4] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
